<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组卷导出 · APCSA 题库</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="index.html">
      <span class="logo">AP</span>
      <span>APCSA 题库<small>Computer Science A</small></span>
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="bank.html">题库浏览</a>
      <a href="paper.html">组卷导出</a>
      <a href="scoring.html">评分标准</a>
      <a href="about.html">使用说明</a>
    </nav>
    <span class="spacer"></span>
    <a class="btn btn-sm" href="bank.html">← 继续选题</a>
  </div>
</header>

<div class="wrap-narrow">

  <h2 class="sec-title" style="margin-top:10px">组卷导出</h2>
  <p class="sec-sub">已选 <b id="pCount" style="color:var(--primary);font-size:16px">0</b> 题 <span id="pSummary" style="color:var(--muted)"></span></p>

  <div id="paperEmpty" class="empty">
    <div class="big">▤</div>
    <p>题车还是空的。回到 <a href="bank.html">题库浏览</a> 勾选题目后，这里会自动出现组卷列表。</p>
  </div>

  <!-- 试卷设置 -->
  <div class="panel" id="paperSettings" hidden>
    <h3>试卷设置</h3>
    <p class="hint">这些信息会写进导出的 Word 卷头。</p>
    <input class="title-input" id="pTitle" placeholder="试卷标题" value="AP Computer Science A 单元练习">
    <input class="title-input" id="pSub" placeholder="副标题（可留空）" style="font-weight:400;font-size:14px">
    <input class="title-input" id="pHead" placeholder="卷头补充信息（如：时间 45 分钟 · 满分 40 分）" style="font-weight:400;font-size:13.5px">

    <h3 style="margin-top:20px">内容选项</h3>
    <label class="field"><input type="checkbox" id="optAnswer" checked><span>附带<b>答案</b>（选项中的正确项会加粗）</span></label>
    <label class="field"><input type="checkbox" id="optExpl" checked><span>附带<b>解析</b>（FRQ 则输出官方评分标准）</span></label>
    <label class="field"><input type="checkbox" id="optTopic" checked><span>题号后标注 <b>Topic</b>（便于学生对照知识点）</span></label>
    <label class="field"><input type="checkbox" id="optSource" checked><span>标注题目<b>来源</b>（年份 / 套卷名）</span></label>
    <label class="field"><input type="checkbox" id="optBreak"><span>每道题<b>单独起页</b>（适合 FRQ 作答）</span></label>
    <label class="field"><span>若不含答案，每道题后留空</span><input class="inline-num" type="number" id="optBlank" value="3" min="0" max="20"><span>行</span></label>
  </div>

  <!-- 题目列表 -->
  <div class="panel" id="paperListPanel" hidden>
    <h3>选题清单</h3>
    <p class="hint">可用 ↑ ↓ 调整顺序，✕ 移出试卷。导出的顺序即为这里显示的顺序。</p>
    <div id="paperList"></div>
  </div>

  <div class="sticky-actions" id="actBar" hidden>
    <button class="btn btn-primary" id="btnDocx">导出 Word (.docx)</button>
    <button class="btn" id="btnPrint">打印 / 导出 PDF</button>
    <button class="btn" id="btnCopyMd">复制为 Markdown</button>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="btnClearCart" style="color:#b91c1c;border-color:#fecaca">清空题车</button>
  </div>

  <div class="note" style="margin-top:20px">
    <b>提示：</b>导出的 .docx 可以直接用 Word 打开继续编辑（调整字号、加校徽、插入答题栏）。若只需 PDF，
    用「打印 / 导出 PDF」并选择「另存为 PDF」即可，排版更紧凑。
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="data/topics.js"></script>
<script src="data/questions.js"></script>
<script src="assets/app.js"></script>
<script src="lib/docx.min.js"></script>
<script src="assets/paper.js"></script>
<script>
(function () {
  /* 题车为空时隐藏设置与列表 */
  function sync() {
    var n = QB.getCart().length;
    document.getElementById('paperSettings').hidden = n === 0;
    document.getElementById('paperListPanel').hidden = n === 0;
  }
  document.addEventListener('cartchange', sync);
  sync();
})();
</script>
</body>
</html>
